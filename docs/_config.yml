# GitHub Pages / Jekyll — https://pages.github.com/
# Built from README via scripts/build-github-pages.sh (CI + optional local runs)

title: "Awesome Agent-Native Services"
# Used only in <title> (short for SEO). On-page <h1> still uses page title from index.md.
seo_html_title: "Awesome Agent-Native Services | The Agent-Native Index"
description: "A curated list of agent-native services for AI agents: email, browsers, memory, sandboxes, payments, and MCP tools, with criteria and onboarding guides."
url: "https://lihaorui.com"
baseurl: "/awesome-agent-native-services"
lang: en-US
author: haoruilee

# Open Graph / Twitter — used by jekyll-seo-tag
logo: "/assets/images/social-preview.png"
social:
  name: Awesome Agent-Native Services
  links:
    - "https://github.com/haoruilee/awesome-agent-native-services"

theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep machine-facing Markdown such as /skill.md byte-identical and avoid a
# duplicate rendered /skill.html page in the sitemap.
optional_front_matter:
  enabled: false

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# jekyll-seo-tag default image when pages do not override.
# social-preview-wide.webp is the 1536x1024 editorial share still;
# social-preview.png remains the 1200x630 PNG crop used as the site logo.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/social-preview-wide.webp

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
