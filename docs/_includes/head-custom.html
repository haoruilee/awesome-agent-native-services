<meta name="robots" content="index, follow">
<meta name="keywords" content="AI agents, agent-native services, agent harness, MCP servers, model context protocol, agent infrastructure, autonomous agents">
<meta name="application-name" content="The Agent-Native Index">
<link rel="alternate" type="text/plain" href="{{ '/llms.txt' | relative_url }}" title="LLM-readable index">
<link rel="alternate" type="text/markdown" href="{{ '/skill.md' | relative_url }}" title="Agent service discovery skill">
<link rel="alternate" type="application/json" href="{{ '/catalog.json' | relative_url }}" title="Machine-readable service catalog">
<link rel="describedby" type="application/schema+json" href="{{ '/catalog.schema.json' | relative_url }}" title="Service catalog schema">
{% if page.page_kind == "home" %}
{% assign collection_pages = site.pages | where: "page_kind", "collection" | sort: "collection_number" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "The Agent-Native Index",
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntity": {
    "@type": "ItemList",
    "numberOfItems": {{ collection_pages | size }},
    "itemListElement": [
      {% for collection in collection_pages %}
      {
        "@type": "ListItem",
        "position": {{ forloop.index }},
        "name": {{ collection.collection_label | default: collection.title | jsonify }},
        "url": {{ collection.url | absolute_url | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "name": "Awesome Agent-Native Services catalog",
  "description": "Versioned JSON records of agent-native services with stable IDs, typed onboarding, protocols, status, and provenance.",
  "url": {{ '/catalog.json' | absolute_url | jsonify }},
  "license": "https://creativecommons.org/publicdomain/zero/1.0/",
  "encodingFormat": "application/json",
  "isAccessibleForFree": true,
  "creator": {
    "@type": "Person",
    "name": "haoruilee",
    "url": "https://github.com/haoruilee"
  }
}
</script>
{% elsif page.page_kind == "collection" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": {{ page.collection_label | default: page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "numberOfItems": {{ page.service_count | default: 0 }},
  "isPartOf": { "@type": "WebSite", "name": "The Agent-Native Index", "url": {{ '/' | absolute_url | jsonify }} }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Index",
      "item": {{ '/' | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Collections",
      "item": {{ '/categories/' | absolute_url | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.collection_label | default: page.title | jsonify }},
      "item": {{ page.url | absolute_url | jsonify }}
    }
  ]
}
</script>
{% endif %}
