name: Catalog freshness and links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-freshness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python3 -m pip install --requirement requirements-validation.txt

      - name: Validate current machine contract
        run: python3 scripts/build-machine-catalog.py --check

      - name: Check catalog inventory and research freshness
        run: >-
          python3 scripts/check-repository-health.py
          --local
          --freshness-max-days 45

      - name: Check canonical service links
        if: always()
        run: >-
          python3 scripts/check-repository-health.py
          --external-canonical
          --workers 16
          --timeout 15
          --retries 2
          --report-json link-audit.json

      - name: Upload link audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-link-audit
          path: link-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify deployed agent endpoints
        if: always()
        run: >-
          bash scripts/check-agent-endpoints.sh
          https://theagentnative.com/
