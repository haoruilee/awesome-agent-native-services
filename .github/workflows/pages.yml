# Validate the catalog contract, build the Jekyll site, deploy it, then verify the
# public same-origin agent endpoints.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python3 -m pip install --requirement requirements-validation.txt

      - name: Validate machine-readable catalog contract
        run: python3 scripts/build-machine-catalog.py --check

      - name: Regenerate rendered documentation
        run: bash scripts/build-github-pages.sh

      - name: Ensure generated artifacts are committed
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Generated artifacts are stale. Run both generators:"
            echo "  python3 scripts/build-machine-catalog.py"
            echo "  bash scripts/build-github-pages.sh"
            git --no-pager diff
            exit 1
          fi

      - name: Check local links and catalog inventory
        run: python3 scripts/check-repository-health.py --local

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
          future: false

      - name: Validate built agent endpoints
        run: python3 scripts/check-repository-health.py --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify public agent endpoints
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout endpoint checker
        uses: actions/checkout@v4

      - name: Check same-origin discovery and data endpoints
        run: >-
          bash scripts/check-agent-endpoints.sh
          https://theagentnative.com/
